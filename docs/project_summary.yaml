project:
  name: Waveshare ESP32-S3 AMOLED 2.41 display stack
  scope: Standalone CircuitPython `rm690b0` driver plus separate `rm690b0_lvgl` integration
  updated_on: 2026-03-07
  intended_use: Bootstrap context for AI/tools before reading full documentation

hardware:
  board: Waveshare ESP32-S3 Touch AMOLED 2.41
  mcu: ESP32-S3
  flash_mb: 16
  psram_mb: 8
  display:
    controller: RM690B0
    interface: QSPI (32-bit command mode)
    resolution: 600x450
  touch:
    controller: FT6336U
    interface: I2C
    address: 0x38

firmware:
  circuitpython_version: 10.1.2
  standalone_driver_status: production-ready
  lvgl_status: feature-complete but not production-ready due to GC/touch instability under memory pressure

firmware_artifacts:
  stable:
    bin:
      path: firmware/firmware-rm690b0.bin
      size_bytes: 1900432
      updated_on: 2026-03-07
    uf2:
      path: firmware/firmware-rm690b0.uf2
      size_bytes: 3670016
      updated_on: 2026-03-07
  lvgl:
    bin:
      path: firmware/firmware-rm690b0-lvgl.bin
      size_bytes: 2124640
      updated_on: 2026-03-07
    uf2:
      path: firmware/firmware-rm690b0-lvgl.uf2
      size_bytes: 4118528
      updated_on: 2026-03-07
  flashing_guidance:
    canonical_esptool_format: .bin
    alternate_distribution_format: .uf2
    note: Both stable and LVGL variants are published in both formats.

entry_points:
  for_humans: docs/project_status_summary.md
  for_ai: docs/project_summary.yaml
  api_reference: docs/RM690B0_DRIVER.md
  technical_notes: docs/TECHNICAL_NOTES.md
  lvgl_reference: docs/RM690B0_LVGL.md

architecture:
  render_backends:
    - name: FRAMEBUFFER
      status: stable baseline finalized
      strengths:
        - best default for imperative drawing
        - supports dirty tracking and dirty-copy via `swap_buffers(copy=True)`
        - `copy=False` is best for full-redraw animation
        - `copy=True` is best for retained UI and incremental updates
    - name: DISPLAY_LIST
      status: stable v1 baseline finalized
      strengths:
        - retained command lists and partial presents
        - runtime-switchable through `render_mode`
        - recommended deployment mode is `BUFFER_SINGLE`
  constraints:
    - mixed `FRAMEBUFFER` and `DISPLAY_LIST` drawing in one frame is intentionally unsupported
    - LVGL uses a separate integration path and is not DISPLAY_LIST reuse

runtime_defaults:
  display_list:
    buffer_mode_recommended: BUFFER_SINGLE
    glyph_atlas_slots: 40
    auto_compact_every_n_frames: 24
    auto_compact_min_commands: 64
    auto_compact_guard_commands: 3400
    auto_compact_guard_payload_bytes: 524288
  framebuffer:
    current_policy:
      - text dirty batching enabled
      - adaptive dirty flush planning enabled
      - transparent BLIT run-copy/span helper enabled
      - partial flush row-copy fast path enabled
      - copy-back rect coalescing for `swap_buffers(copy=True)` enabled
    reverted_experiments:
      - aggressive dirty coalescing policy variant
      - narrow-partial chunk-size heuristic

benchmark_gates:
  framebuffer_profile_gate:
    generator: examples/benchmark_gfx/benchmark_fb_profile.py
    compare_script: examples/benchmark_gfx/compare_fb_profile.py
    canonical_targets:
      primitive_stress_fps: 35.511
      full_redraw_control_fps: 25.107
      retained_blit_transparent_fps: 573.963
    acceptance:
      primitive_stress_min_fps: 33.0
      full_redraw_control_min_fps: 24.0
      retained_blit_transparent_min_fps: 520.0
      retained_blit_transparent_max_avg_ms: 1.90
      retained_blit_transparent_max_p95_ms: 2.10
  framebuffer_animation_reference:
    script: examples/benchmark_gfx/benchmark_animation_bg.py
    copy_false_fps: 1009.93
    copy_true_fps: 498.33
    note: Animation-focused reference, not directly comparable 1:1 with `fb_profile` retained scenarios
  display_list_profile_reference:
    script: examples/benchmark_gfx_displaylist/benchmark_dl_profile.py
    mode: short profile baseline
    notes: Use as DL regression reference together with current runtime defaults

key_code_paths:
  driver_core: ports/espressif/common-hal/rm690b0/RM690B0.c
  driver_internal: ports/espressif/common-hal/rm690b0/rm690b0_internal.h
  primitives: ports/espressif/common-hal/rm690b0/rm690b0_draw.c
  text: ports/espressif/common-hal/rm690b0/rm690b0_text.c
  images: ports/espressif/common-hal/rm690b0/rm690b0_image.c
  bindings: shared-bindings/rm690b0/RM690B0.c

known_risks:
  - LVGL + touch can become unresponsive under GC pressure or heavy heap churn
  - geometry paths for `rotation != 0` are functional but not performance-tuned
  - `copy=True` retained FB workloads still spend notable time in swap/copy phase, but low-risk tuning is exhausted for now

operator_guidance:
  - Keep FRAMEBUFFER internals frozen unless a concrete regression appears or rotation-specific tuning becomes necessary
  - Keep DISPLAY_LIST internals frozen unless a reproducible regression or a new target workload appears
  - Use `project_status_summary.md` for narrative status; keep this file compact and factual
